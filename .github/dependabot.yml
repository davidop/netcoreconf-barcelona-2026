version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
  - package-ecosystem: "npm"
    directory: "/slides"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 4
  - package-ecosystem: "nuget"
    directory: "/src/MerlinOps.Api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 4
  - package-ecosystem: "nuget"
    directory: "/src/MerlinOps.AgentFrameworkAdapter"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 4
  - package-ecosystem: "nuget"
    directory: "/src/MerlinOps.AppHost"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 4
  - package-ecosystem: "nuget"
    directory: "/tests/MerlinOps.Tests"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 4
  - package-ecosystem: "terraform"
    directory: "/infra"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
