name: Slidev Browser E2E
on:
  push:
    branches: [main]
    paths:
      - 'slides/**'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'slides/**'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: slides
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slidev-playwright-evidence
          path: |
            slides/test-results
            slides/playwright-report
          retention-days: 7
