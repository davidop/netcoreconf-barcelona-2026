name: MerlinOps CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  documentation:
    name: Docs links + SVG integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Markdown references and SVG assets (offline)
        run: python tools/check_docs.py
      - name: Validate read-only Azure probe syntax and resource scope (offline)
        shell: pwsh
        run: ./tools/azure-containerapps-readonly.ps1 -ResourceId '/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/demo/providers/Microsoft.App/containerApps/example' -ValidateOnly

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore tests
        run: dotnet restore tests/MerlinOps.Tests/MerlinOps.Tests.csproj
      - name: Build API and tests
        run: dotnet build tests/MerlinOps.Tests/MerlinOps.Tests.csproj --no-restore -c Release
      - name: Test simulated Guardians and guardrails
        run: dotnet test tests/MerlinOps.Tests/MerlinOps.Tests.csproj --no-restore -c Release --logger 'console;verbosity=normal'
      - name: Compile and execute Microsoft Agent Framework preview smoke
        run: dotnet run --project src/MerlinOps.AgentFrameworkAdapter/MerlinOps.AgentFrameworkAdapter.csproj -c Release
      - name: Build Aspire AppHost
        run: dotnet build src/MerlinOps.AppHost/MerlinOps.AppHost.csproj -c Release

  slidev:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: slides
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: slidev-static-preview
          path: slides/dist
          retention-days: 7

  replay-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Replay sanitizer behavior (local synthetic tests only)
        run: python -m unittest discover -s tools/tests -v

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.5'
      - name: Format check
        run: terraform -chdir=infra fmt -check -diff -recursive
      - name: Init without backend (no Azure credentials)
        run: terraform -chdir=infra init -backend=false -input=false
      - name: Validate syntax (never apply)
        run: terraform -chdir=infra validate
      - name: Init GitHub OIDC identity bootstrap without state backend
        run: terraform -chdir=infra/bootstrap-oidc init -backend=false -input=false
      - name: Validate OIDC bootstrap with all resources disabled
        run: terraform -chdir=infra/bootstrap-oidc validate

  speaker-template:
    name: Speaker PDF packaging contracts (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local speaker-packaging dependencies
        run: python -m pip install -r tools/requirements-speaker.txt
      - name: Test official template guardrails and PDF order using synthetic fixtures
        run: python -m unittest discover -s tests -p 'test_speaker_deck.py' -v
      # Real organiser PPTX is intentionally not stored in Git or CI.
      # Final conference assembly is an approved local manual step.
