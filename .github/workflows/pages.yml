name: Publish static Slidev to GitHub Pages (manual)
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
        working-directory: slides
      - run: npm test
        working-directory: slides
      - run: npm run build:pages
        working-directory: slides
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: slides/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://davidop.github.io/netcoreconf-barcelona-2026/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
